include dank-tabs.conf
include dank-theme.conf

# Enable the cursor trail animation (0.0 to disable, or choose a length)
cursor_trail 3

# The decay time of the trail in seconds (lower is faster, higher leaves longer trails)
cursor_trail_decay 0.1 0.4

# The minimum distance (in cells) the cursor must move to trigger a trail animation
cursor_trail_start_threshold 2

# Blinking interval (in seconds) followed by an optional CSS easing animation style
cursor_blink_interval 0.5 ease-in-out

# Stop blinking after 15 seconds of terminal inactivity (0 to never stop)
cursor_stop_blinking_after 15.0

background_opacity 0.8
